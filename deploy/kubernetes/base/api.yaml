# Next.js Route Handlers behind the managed server (apps/api/server.mjs, milestone 30). On SIGTERM it
# fails readiness, answers new requests with an explicit "not processed" 503, closes open SSE streams
# so browsers resume their signed cursor on another replica, and exits within API_SHUTDOWN_GRACE_MS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app.kubernetes.io/name: api, app.kubernetes.io/component: api }
spec:
  # No replicas field: the HorizontalPodAutoscaler below owns the count (minimum 2). A replicas value
  # here would be re-applied by every release and fight the autoscaler.
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api, app.kubernetes.io/component: api }
    spec:
      serviceAccountName: pp-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      # preStop 5 s (endpoint removal reaches the gateway) + API_SHUTDOWN_GRACE_MS 20 s + margin.
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: api }
      containers:
        - name: api
          image: portfolio-pilot-api
          imagePullPolicy: IfNotPresent
          # tini (the image ENTRYPOINT) stays PID 1. Each file under /mnt/secrets (mounted by the overlay:
          # Key Vault CSI in AKS) becomes the environment variable it is named after, then node replaces sh.
          args:
            - sh
            - -c
            - 'for f in /mnt/secrets/*; do [ -f "$f" ] && export "${f##*/}=$(cat "$f")"; done; exec node server.mjs'
          ports:
            - { name: http, containerPort: 3001, protocol: TCP }
          envFrom:
            - configMapRef: { name: app-shared }
            - configMapRef: { name: api-config }
          env:
            - name: INSTANCE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources:
            requests: { cpu: 150m, memory: 320Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # Readiness fails only while draining or misconfigured: a shared PostgreSQL/Redis outage is
          # reported as "degraded" with 200, so it cannot remove every replica at once (milestone 30).
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # Writable SDK workspace for live article analysis; application code stays read-only.
            - { name: agent-workspace, mountPath: /var/lib/portfolio-pilot/agent-workspace }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: agent-workspace
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  selector: { app.kubernetes.io/name: api }
  ports:
    - { name: http, port: 3001, targetPort: http, protocol: TCP, appProtocol: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: { app.kubernetes.io/name: api }
---
# CPU is a safety net, not the SSE capacity signal: idle event streams cost memory and Redis reads but
# almost no CPU. The initial connection-based policy is manual (docs/kubernetes/scaling.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
    # Removing a replica closes its SSE streams; scale down slowly so reconnects stay spread out.
    scaleDown:
      stabilizationWindowSeconds: 600
      policies: [{ type: Pods, value: 1, periodSeconds: 300 }]
