# One service account per workload (milestone 34 credential matrix, docs/azure/credentials.md). The AKS
# overlay adds the `azure.workload.identity/client-id` annotation that binds each one to its own
# user-assigned identity. No workload talks to the Kubernetes API, so no token is mounted by default;
# the workload identity webhook projects its own audience-bound token where a pod opts in.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pp-web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pp-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pp-ingestion
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pp-outbox
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pp-agent
automountServiceAccountToken: false
