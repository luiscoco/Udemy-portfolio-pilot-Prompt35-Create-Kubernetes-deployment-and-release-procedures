# Application-specific ingress/egress on top of the baseline (deploy/kubernetes/policies).
# The public origin: only the gateway proxies reach the frontend and the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: web }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { gateway.networking.k8s.io/gateway-name: portfolio-pilot }
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { gateway.networking.k8s.io/gateway-name: portfolio-pilot }
        # nginx's /api proxy (direct port-forward debugging of the web pod only).
        - podSelector:
            matchLabels: { app.kubernetes.io/name: web }
      ports:
        - { protocol: TCP, port: 3001 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-egress-api
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: web }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: api }
      ports:
        - { protocol: TCP, port: 3001 }
