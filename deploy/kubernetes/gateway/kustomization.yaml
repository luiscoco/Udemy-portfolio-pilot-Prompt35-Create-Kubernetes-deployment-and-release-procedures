# The public HTTPS origin. Included by the app overlays; hostnames, the GatewayClass and the TLS
# certificate source are environment-specific.
# No `app.kubernetes.io/part-of` label here: Istio copies Gateway labels onto the proxy pods it creates,
# and that label would put the gateway itself under the application's default-deny NetworkPolicy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway.yaml
