# The migration URL (provisioning.md step 7), mounted as the file DATABASE_URL. No secretObjects.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: migrate-secrets
  labels: { app.kubernetes.io/part-of: portfolio-pilot }
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: RELEASE_PARAMETER
    keyvaultName: RELEASE_PARAMETER
    tenantId: RELEASE_PARAMETER
    cloudName: ""
    objects: |
      array:
        - |
          objectName: database-migrator-url
          objectType: secret
          objectAlias: DATABASE_URL
