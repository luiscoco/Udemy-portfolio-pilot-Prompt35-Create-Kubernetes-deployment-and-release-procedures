            volumeAttributes: { secretProviderClass: outbox-secrets }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-agent
spec:
  template:
    metadata:
      labels: { azure.workload.identity/use: "true" }
    spec:
      containers:
        - name: worker
          volumeMounts:
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: agent-secrets }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pp-api
  annotations: { azure.workload.identity/client-id: RELEASE_PARAMETER }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pp-ingestion
  annotations: { azure.workload.identity/client-id: RELEASE_PARAMETER }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pp-outbox
  annotations: { azure.workload.identity/client-id: RELEASE_PARAMETER }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pp-agent
  annotations: { azure.workload.identity/client-id: RELEASE_PARAMETER }
