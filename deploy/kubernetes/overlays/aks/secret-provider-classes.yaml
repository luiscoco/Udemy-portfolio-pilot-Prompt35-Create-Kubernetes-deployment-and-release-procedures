# Key Vault secrets through the AKS Secrets Store CSI driver, each read with the pod's OWN workload
# identity (clientID = that workload's user-assigned identity; per-secret "Key Vault Secrets User" grants
# in docs/azure/provisioning.md step 8). objectAlias is the environment variable name: the container
# entry command exports each mounted file under its own name. No secretObjects: application secrets
# never become Kubernetes Secrets. The add-on re-reads Key Vault every 2 minutes, but processes read
# their configuration once, so a rotation still needs `kubectl rollout restart` (credentials.md).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-secrets
  labels: { app.kubernetes.io/part-of: portfolio-pilot }
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: RELEASE_PARAMETER
    keyvaultName: RELEASE_PARAMETER
    tenantId: RELEASE_PARAMETER
    cloudName: ""
    objects: |
      array:
        - |
          objectName: auth-secret
          objectType: secret
          objectAlias: AUTH_SECRET
        - |
          objectName: entra-client-secret
          objectType: secret
          objectAlias: ENTRA_CLIENT_SECRET
        - |
          objectName: observability-actor-key
          objectType: secret
          objectAlias: OBSERVABILITY_ACTOR_KEY
        - |
          objectName: anthropic-api-key
          objectType: secret
          objectAlias: ANTHROPIC_API_KEY
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ingestion-secrets
  labels: { app.kubernetes.io/part-of: portfolio-pilot }
