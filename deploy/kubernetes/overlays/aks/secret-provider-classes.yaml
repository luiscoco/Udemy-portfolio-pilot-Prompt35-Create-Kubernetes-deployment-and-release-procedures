    objects: |
      array:
        - |
          objectName: alpaca-api-key
          objectType: secret
          objectAlias: ALPACA_API_KEY
        - |
          objectName: alpaca-api-secret
          objectType: secret
          objectAlias: ALPACA_API_SECRET
        - |
          objectName: observability-actor-key
          objectType: secret
          objectAlias: OBSERVABILITY_ACTOR_KEY
---
