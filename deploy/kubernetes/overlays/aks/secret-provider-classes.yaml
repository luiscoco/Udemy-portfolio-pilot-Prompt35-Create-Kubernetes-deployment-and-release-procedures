---
# The gateway listener needs a Kubernetes TLS Secret (Gateway API certificateRefs), so this one class
# syncs the PEM certificate and key into `portfolio-pilot-tls`. The sync exists only while a pod mounts
# the class: the tls-sync Deployment (tls-sync.yaml) does nothing else.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gateway-tls
  labels: { app.kubernetes.io/part-of: portfolio-pilot }
spec:
  provider: azure
  secretObjects:
    - secretName: portfolio-pilot-tls
      type: kubernetes.io/tls
      data:
        - { objectName: gateway-tls-key, key: tls.key }
        - { objectName: gateway-tls-crt, key: tls.crt }
  parameters:
    usePodIdentity: "false"
    clientID: RELEASE_PARAMETER
    keyvaultName: RELEASE_PARAMETER
    tenantId: RELEASE_PARAMETER
    cloudName: ""
    objects: |
      array:
        - |
          objectName: gateway-tls-key
          objectType: secret
        - |
          objectName: gateway-tls-crt
          objectType: secret
