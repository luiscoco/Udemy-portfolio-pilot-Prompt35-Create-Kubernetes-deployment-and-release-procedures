      - select: { kind: SecretProviderClass, name: ingestion-secrets }
        fieldPaths:
          - spec.parameters.clientID
  - source: { kind: ConfigMap, name: release-parameters, fieldPath: data.OUTBOX_DATABASE_URL }
    targets:
      - select: { kind: ConfigMap, name: outbox-config }
        fieldPaths:
          - data.DATABASE_URL
  - source: { kind: ConfigMap, name: release-parameters, fieldPath: data.OUTBOX_OBJECT_ID }
    targets:
      - select: { kind: ConfigMap, name: outbox-config }
        fieldPaths:
          - data.REDIS_ENTRA_OBJECT_ID
  - source: { kind: ConfigMap, name: release-parameters, fieldPath: data.OUTBOX_CLIENT_ID }
    targets:
      - select: { kind: ServiceAccount, name: pp-outbox }
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/client-id]
      - select: { kind: SecretProviderClass, name: outbox-secrets }
        fieldPaths:
          - spec.parameters.clientID
  - source: { kind: ConfigMap, name: release-parameters, fieldPath: data.AGENT_DATABASE_URL }
    targets:
      - select: { kind: ConfigMap, name: agent-config }
        fieldPaths:
          - data.DATABASE_URL
  - source: { kind: ConfigMap, name: release-parameters, fieldPath: data.AGENT_OBJECT_ID }
    targets:
      - select: { kind: ConfigMap, name: agent-config }
        fieldPaths:
          - data.REDIS_ENTRA_OBJECT_ID
  - source: { kind: ConfigMap, name: release-parameters, fieldPath: data.AGENT_CLIENT_ID }
    targets:
      - select: { kind: ServiceAccount, name: pp-agent }
