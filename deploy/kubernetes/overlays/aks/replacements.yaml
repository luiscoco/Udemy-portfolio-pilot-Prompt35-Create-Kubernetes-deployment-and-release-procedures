  - source: { kind: ConfigMap, name: release-parameters, fieldPath: data.TLS_CLIENT_ID }
    targets:
      - select: { kind: ServiceAccount, name: pp-tls-sync }
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/client-id]
      - select: { kind: SecretProviderClass, name: gateway-tls }
        fieldPaths:
          - spec.parameters.clientID
  - source: { kind: ConfigMap, name: release-parameters, fieldPath: data.ENTRA_CLIENT_ID }
    targets:
      - select: { kind: ConfigMap, name: api-config }
        fieldPaths:
          - data.ENTRA_CLIENT_ID
  - source: { kind: ConfigMap, name: release-parameters, fieldPath: data.ENTRA_TENANT_ID }
    targets:
      - select: { kind: ConfigMap, name: api-config }
        fieldPaths:
          - data.ENTRA_TENANT_ID
