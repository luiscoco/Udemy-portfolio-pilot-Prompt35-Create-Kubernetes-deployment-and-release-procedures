# Mount the local Secret where AKS mounts the Key Vault CSI volume; the entry command exports each file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          volumeMounts:
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
      volumes:
        - name: secrets
          secret: { secretName: local-app, defaultMode: 0440 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ingestion
spec:
  template:
    spec:
      containers:
        - name: worker
          volumeMounts:
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
      volumes:
        - name: secrets
          secret: { secretName: local-app, defaultMode: 0440 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-outbox
spec:
  template:
    spec:
      containers:
        - name: worker
          volumeMounts:
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
      volumes:
        - name: secrets
          secret: { secretName: local-app, defaultMode: 0440 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-agent
spec:
  template:
    spec:
      containers:
        - name: worker
          volumeMounts:
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
            # Local session-artifact backend (Azure Blob in AKS).
            - { name: session-artifacts, mountPath: /var/lib/portfolio-pilot/session-artifacts }
      volumes:
        - name: secrets
          secret: { secretName: local-app, defaultMode: 0440 }
        - name: session-artifacts
          emptyDir: { sizeLimit: 256Mi }
